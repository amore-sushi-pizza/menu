backend:
  name: git-gateway
  branch: main # Якщо ваша головна гілка називається master, змініть на master

media_folder: "img/products" # Папка, куди зберігатимуться нові фото
public_folder: "./img/products"

collections:
  # --- 1. ГОЛОВНІ КАТЕГОРІЇ (Новий файл mainCategories.json) ---
  - name: "main_categories_list"
    label: "Головні розділи (Кнопки)"
    files:
      - label: "Головні категорії"
        name: "mainCategories"
        file: "mainCategories.json"
        fields:
          - label: "Список головних категорій"
            name: "items"
            widget: "list"
            show_add_top: true
            sortable: true
            summary: "{{fields.title}}"
            fields:
              - {label: "ID", name: "id", widget: "uuid"}
              - {label: "Назва (напр. Піца)", name: "title", widget: "string"}
              - {label: "Аліас (напр. pizza)", name: "alias", widget: "string"}

  # --- 2. ПІДКАТЕГОРІЇ (categories.json) ---
  - name: "categories_list"
    label: "Підкатегорії (Вкладки)"
    files:
      - label: "Налаштування підкатегорій"
        name: "categories"
        file: "categories.json"
        fields:
          - label: "Список підкатегорій"
            name: "items"
            widget: "list"
            show_add_top: true
            sortable: true
            summary: "{{fields.title}}"
            fields:
              - {label: "ID", name: "id", widget: "uuid"}
              - {label: "Назва (напр. Теплі роли)", name: "title", widget: "string"}
              - {label: "Посилання (напр. warm-roly)", name: "category", widget: "string"}
              # ТЕПЕР ЦЕ ЗВ'ЯЗОК: Вибираємо головну категорію з першого файлу
              - label: "Головна група"
                name: "mainCategoryIndex"
                widget: "relation"
                collection: "main_categories_list"
                file: "mainCategories"
                search_fields: ["items.*.title"]
                display_fields: ["items.*.title"]
                value_field: "items.*.id"

  # --- 3. МЕНЮ СТРАВ (database.json) ---
  - name: "menu"
    label: "Меню закладу (Страви)"
    files:
      - label: "Усі страви"
        name: "database"
        file: "database.json"
        fields:
          - label: "Список страв"
            name: "items"
            widget: "list"
            show_add_top: true
            sortable: true
            summary: "{{fields.article}} : {{fields.title}}"
            fields:
              - {label: "ID", name: "id", widget: "uuid"}
              - {label: "Назва", name: "title", widget: "string"}
              - {label: "Категорія (Застаріле, можна не вводити)", name: "Category", widget: "string", required: false}
              - {label: "Тег (напр. Піца)", name: "article", widget: "string", required: false}
              - {label: "Опис", name: "description", widget: "text", required: false}
              - {label: "Ціна", name: "price", widget: "string", required: false}
              
              # ЗВ'ЯЗОК З ПІДКАТЕГОРІЯМИ (без зірочок)
              - label: "Розділ меню (Підкатегорія)"
                name: "categoryIndex"
                widget: "relation"
                collection: "categories_list"
                file: "categories"
                search_fields: ["items.*.title"]
                display_fields: ["items.*.title"]
                value_field: "items.*.id"
                
              - {label: "Вага", name: "weight", widget: "string", required: false}
              - {label: "Фото", name: "img", widget: "image", required: false}
